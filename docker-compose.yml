version: '3.8'

services:
  mysql:
    image: mysql:8.0.44
    container_name: employee-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - employee-network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      timeout: 20s
      retries: 10

  # Redis for caching, rate limiting, and key-value operations
  redis-cache:
    image: redis:alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - '6379:6379'
    networks:
      - employee-network
    # Cache config: maxmemory + LRU eviction, no persistence needed
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save "" --appendonly no

  # Redis for pub/sub messaging (lightweight, no persistence needed)
  redis-pubsub:
    image: redis:alpine
    container_name: redis-pubsub
    restart: unless-stopped
    ports:
      - '6380:6379'
    networks:
      - employee-network
    # No persistence for pub/sub (messages are ephemeral)
    command: redis-server --save "" --appendonly no

networks:
  employee-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
